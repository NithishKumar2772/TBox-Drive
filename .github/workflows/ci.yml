name: CI
on:
  push:
    branches: [main, 'foundation/**', 'feature/**']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - name: Format Go sources
        run: find ./cmd ./internal -name '*.go' -print0 | xargs -0 gofmt -w
      - run: go test ./...
      - run: go vet ./...
      - run: go build ./...
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - working-directory: frontend
        run: npm install
      - working-directory: frontend
        run: npm run build
