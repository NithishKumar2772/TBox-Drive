name: CI
on:
  push:
    branches: [main, 'foundation/**', 'feature/**']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.11'
      - name: Download Go modules
        run: go mod download
      - name: Format Go sources
        run: find ./cmd ./internal -name '*.go' -print0 | xargs -0 gofmt -w
      - name: Verify module files
        run: go mod tidy -diff
      - run: go test ./...
      - name: Scan Go dependencies for known vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 ./...
      - run: go vet ./...
      - run: go build ./...
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - working-directory: frontend
        run: npm install
      - name: Audit frontend dependencies
        working-directory: frontend
        run: npm audit --audit-level=high
      - working-directory: frontend
        run: npm run build
  desktop-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.11'
      - name: Download Go modules
        run: go mod download
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Build Windows desktop and self-hosted web applications
        run: ./scripts/build-windows.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: TBoxDrive-windows-amd64
          path: |
            dist/TBoxDrive.exe
            dist/TBoxDrive-Web.exe
