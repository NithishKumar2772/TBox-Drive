name: Windows Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (example: v0.1.0)"
        required: true
        type: string
      prerelease:
        description: "Mark release as prerelease"
        required: true
        default: true
        type: boolean
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  validate:
    name: Validate source and frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.11"
      - name: Download Go modules
        run: go mod download
      - name: Verify formatting
        shell: bash
        run: |
          files="$(find ./cmd ./internal -name '*.go' -print)"
          test -z "$(gofmt -l $files)"
      - name: Verify module files
        run: go mod tidy -diff
      - name: Run Go tests
        run: go test ./...
      - name: Scan Go dependencies
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 ./...
      - name: Run Go vet
        run: go vet ./...
      - name: Build Go packages
        run: go build ./...
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund
      - name: Audit frontend dependencies
        working-directory: frontend
        run: npm audit --audit-level=high
      - name: Build frontend
        working-directory: frontend
        run: npm run build

  windows:
    name: Build Windows x64 applications
    needs: validate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.11"
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Download Go modules
        run: go mod download
      - name: Build desktop and self-hosted Web
        shell: pwsh
        run: ./scripts/build-windows.ps1
      - name: Package portable Windows x64 archive
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/package | Out-Null
          Copy-Item dist/TBoxDrive.exe dist/package/
          Copy-Item dist/TBoxDrive-Web.exe dist/package/
          Copy-Item README.md, LICENSE, SECURITY.md dist/package/
          Compress-Archive -Path dist/package/* -DestinationPath dist/TBoxDrive-windows-x64.zip -CompressionLevel Optimal
          $files = @("dist/TBoxDrive.exe", "dist/TBoxDrive-Web.exe", "dist/TBoxDrive-windows-x64.zip")
          $lines = foreach ($file in $files) {
            $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLower()
            "$hash  $([System.IO.Path]::GetFileName($file))"
          }
          $lines | Set-Content dist/SHA256SUMS.txt
      - name: Upload release candidate artifacts
        uses: actions/upload-artifact@v7
        with:
          name: TBoxDrive-windows-x64
          path: |
            dist/TBoxDrive.exe
            dist/TBoxDrive-Web.exe
            dist/TBoxDrive-windows-x64.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error

  publish:
    name: Publish validated Windows release
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: [validate, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v7
        with:
          name: TBoxDrive-windows-x64
          path: release-assets
      - name: Resolve release tag
        id: tag
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "name=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
            echo "prerelease=${{ inputs.prerelease }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.name }}
        shell: bash
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            test "$(git rev-parse HEAD)" = "$(git rev-parse "$RELEASE_TAG^{commit}")"
          else
            git fetch origin main
            test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
            if git rev-parse "$RELEASE_TAG" >/dev/null 2>&1; then
              echo "Tag already exists: $RELEASE_TAG" >&2
              exit 1
            fi
          fi
      - name: Generate release notes
        shell: bash
        run: |
          cat > RELEASE_NOTES.md <<'NOTES'
          ## TBox Drive Windows x64 (early preview)

          This release contains Windows x64 builds only:
          - TBoxDrive.exe: Wails desktop application.
          - TBoxDrive-Web.exe: local-only self-hosted browser client.
          - TBoxDrive-windows-x64.zip: portable archive with both executables and project notices.
          - SHA256SUMS.txt: SHA-256 checksums.

          ### Requirements
          - Windows 10/11 x64.
          - TeraBox Open Platform application credentials and exact application folder.
          - Microsoft Edge WebView2 Runtime for the desktop application.
          - WinFsp runtime is required only for the virtual-drive prototype.

          ### Important limitations
          - This is an early preview, not a production multi-platform release.
          - TeraBox live-account acceptance is not covered by CI.
          - The Windows virtual drive is a whole-file cache prototype, not production streaming/offline sync.
          - The browser client is loopback-only, single-user and requires temporary disk space for upload staging.
          - macOS, Linux, Android, iOS and TV packages are not included because those platform apps are not yet implemented and validated.
          - Per-file encryption/vault/recovery is not implemented.
          - Keep independent backups of important files.
          NOTES
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.tag.outputs.name }}
          PRERELEASE: ${{ steps.tag.outputs.prerelease }}
        shell: bash
        run: |
          args=(--title "TBox Drive $RELEASE_TAG" --notes-file RELEASE_NOTES.md)
          if [ "$PRERELEASE" = "true" ]; then args+=(--prerelease); fi
          gh release create "$RELEASE_TAG" release-assets/TBoxDrive.exe release-assets/TBoxDrive-Web.exe release-assets/TBoxDrive-windows-x64.zip release-assets/SHA256SUMS.txt "${args[@]}"
